<div>
    <h4>{% block page_title %}Welcome! 👋{% endblock %}</h4>
    <small>{% block page_subtitle %}CivicPulse Smart City Platform{% endblock %}</small>
</div>
<div class="top-actions">
    <form method="GET" action="{% url 'dashboards:admin_search' %}">
        <input name="q" class="search" placeholder="Quick search..." value="{{ query|default:'' }}">
    </form>
    <a href="{% url 'dashboards:ai_assistant' %}" class="ai-btn text-decoration-none"><i class="bi bi-stars"></i> AI Assistant</a>
    
    <!-- Notifications Dropdown -->
    <div class="dropdown me-2">
        <button class="btn btn-link text-dark position-relative p-0 border-0" type="button" id="notifDropdown" data-bs-toggle="dropdown" aria-expanded="false" onclick="fetchNotifications()">
          <i class="bi bi-bell fs-5"></i>
          <span id="notif-badge" class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger d-none" style="font-size: 10px; padding: 4px 6px;">
            0
          </span>
        </button>
        <ul class="dropdown-menu dropdown-menu-end shadow border-0 py-0 overflow-hidden" aria-labelledby="notifDropdown" style="width: 320px; border-radius: 12px; margin-top: 10px;">
          <li class="px-3 py-2 border-bottom bg-light">
            <h6 class="mb-0 fw-bold small text-uppercase text-muted">Notifications</h6>
          </li>
          <div id="notif-items" style="max-height: 350px; overflow-y: auto;">
            <li class="px-3 py-4 text-center text-muted small">
              <div class="spinner-border spinner-border-sm mb-2" role="status"></div>
              <div>Loading...</div>
            </li>
          </div>
          <li class="p-0 border-top">
            <a class="dropdown-item text-center small py-2 text-primary fw-bold" href="{% url 'dashboards:admin_notifications' %}">View All</a>
          </li>
        </ul>
    </div>

    <div class="admin-profile">
        <i class="bi bi-person-circle" style="font-size: 1.5rem; color: #7c3aed;"></i>
        <a href="{% url 'dashboards:admin_profile' %}" class="text-decoration-none text-dark">
            {{user.username|default:user}}
        </a>
    </div>
    <form action="{% url 'accounts:logout' %}" method="POST" class="m-0">
        {% csrf_token %}
        <button type="submit" class="btn btn-sm btn-outline-danger px-3 rounded-pill fw-bold">
            <i class="bi bi-box-arrow-right me-1"></i> Logout
        </button>
    </form>
</div>
