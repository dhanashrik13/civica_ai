{% load i18n %}
<div class="fw-bold">{% trans "Civic Issue Portal" %}</div>

<div class="d-flex align-items-center gap-3">
  <!-- Language Switcher -->
  <form action="{% url 'set_language' %}" method="post" id="citizen-lang-form">
    {% csrf_token %}
    <input name="next" type="hidden" value="{{ request.get_full_path }}">
    <input type="hidden" name="language" id="citizen-lang-input">
    <div class="dropdown">
      <button class="btn btn-outline-light dropdown-toggle btn-sm" type="button" id="citizenLangSwitch" data-bs-toggle="dropdown" aria-expanded="false" style="border-radius: 20px;">
          <i class="bi bi-globe me-1"></i>
          {% get_current_language as CURRENT_LANG %}
          {% if CURRENT_LANG == 'hi' %}हिंदी{% elif CURRENT_LANG == 'mr' %}मराठी{% else %}English{% endif %}
      </button>
      <ul class="dropdown-menu dropdown-menu-end shadow border-0" aria-labelledby="citizenLangSwitch" style="border-radius: 12px; font-size: 14px;">
          <li>
              <button type="button" class="dropdown-item rounded-2 {% if CURRENT_LANG == 'en' %}active{% endif %}" onclick="submitCitizenLang('en')">English</button>
          </li>
          <li>
              <button type="button" class="dropdown-item rounded-2 {% if CURRENT_LANG == 'hi' %}active{% endif %}" onclick="submitCitizenLang('hi')">हिंदी (Hindi)</button>
          </li>
          <li>
              <button type="button" class="dropdown-item rounded-2 {% if CURRENT_LANG == 'mr' %}active{% endif %}" onclick="submitCitizenLang('mr')">मराठी (Marathi)</button>
          </li>
      </ul>
    </div>
  </form>
  <script>
    function submitCitizenLang(lang) {
        document.getElementById('citizen-lang-input').value = lang;
        document.getElementById('citizen-lang-form').submit();
    }
  </script>

  <!-- Notifications Dropdown -->
  <div class="dropdown me-2">
    <button class="btn btn-link text-white position-relative p-0 border-0" type="button" id="notifDropdown" data-bs-toggle="dropdown" aria-expanded="false" onclick="fetchNotifications()">
      <i class="bi bi-bell fs-5"></i>
      <span id="notif-badge" class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger d-none" style="font-size: 10px; padding: 4px 6px;">
        0
      </span>
    </button>
    <ul class="dropdown-menu dropdown-menu-end shadow border-0 py-0 overflow-hidden" aria-labelledby="notifDropdown" style="width: 320px; border-radius: 12px; margin-top: 10px;">
      <li class="px-3 py-2 border-bottom bg-light">
        <h6 class="mb-0 fw-bold small text-uppercase text-muted">{% trans "Notifications" %}</h6>
      </li>
      <div id="notif-items" style="max-height: 350px; overflow-y: auto;">
        <!-- Dynamic Items -->
        <li class="px-3 py-4 text-center text-muted small">
          <div class="spinner-border spinner-border-sm mb-2" role="status"></div>
          <div>{% trans "Loading..." %}</div>
        </li>
      </div>
    </ul>
  </div>

  <!-- Profile Dropdown -->
  <div class="dropdown">
    <button class="btn btn-link p-0 border-0 d-flex align-items-center text-decoration-none" type="button" id="profileDropdown" data-bs-toggle="dropdown" aria-expanded="false">
      <div class="rounded-circle bg-primary text-white d-flex justify-content-center align-items-center"
           style="width:36px;height:36px; font-weight: 600;">
        {{ request.user.full_name|slice:":1"|upper|default:request.user.username|slice:":1"|upper }}
      </div>
    </button>
    <ul class="dropdown-menu dropdown-menu-end shadow border-0 mt-2" aria-labelledby="profileDropdown" style="border-radius: 12px; min-width: 200px;">
      <li class="px-3 py-2 border-bottom mb-1">
        <div class="fw-bold text-dark small">{{ request.user.full_name|default:request.user.username }}</div>
        <div class="text-muted" style="font-size: 11px;">{{ request.user.email }}</div>
      </li>
      <li><a class="dropdown-item small py-2" href="{% url 'accounts:profile' %}">
        <i class="bi bi-person me-2"></i>{% trans "My Profile" %}
      </a></li>
      <li><hr class="dropdown-divider"></li>
      <li>
        <form action="{% url 'accounts:logout' %}" method="post" class="px-3">
          {% csrf_token %}
          <button type="submit" class="btn btn-sm btn-outline-danger w-100 mt-1">
            <i class="bi bi-box-arrow-right me-1"></i>{% trans "Logout" %}
          </button>
        </form>
      </li>
    </ul>
  </div>
</div>

<style>
  .notif-item:hover {
    background-color: #f8f9fa !important;
  }
  .dropdown-item:active {
    background-color: #e9ecef;
    color: inherit;
  }
</style>
