<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Select Role for Login</title>
  <style>
    body {
      font-family: Poppins, sans-serif;
      background: linear-gradient(135deg, #6a11cb, #2575fc);
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      color: white;
    }
    .container {
      display: flex;
      gap: 40px;
    }
    .role-card {
      background: rgba(255, 255, 255, 0.1);
      padding: 40px;
      border-radius: 20px;
      text-align: center;
      transition: 0.3s;
      cursor: pointer;
    }
    .role-card:hover {
      transform: scale(1.05);
      background: rgba(255, 255, 255, 0.2);
    }
    button {
      background: white;
      border: none;
      color: #2575fc;
      padding: 10px 20px;
      margin-top: 15px;
      border-radius: 10px;
      cursor: pointer;
      font-weight: bold;
    }
  </style>
</head>
<body>
<form method="POST">
  {% csrf_token %}
  <div class="container">
    <button name="role" value="Citizen" class="role-card">👤 Citizen</button>
  </div>
</form>

</body>
</html>
