<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Report an Issue</title>
  <style>
    body {
      font-family: 'Poppins', sans-serif;
      background: linear-gradient(135deg, #8e2de2, #4a00e0);
      margin: 0;
      padding: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }
    .container {
      width: 90%;
      max-width: 650px;
      background: #fff;
      padding: 2.5rem;
      border-radius: 12px;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.1);
    }
    h2 {
      text-align: center;
      color: #4a00e0;
      margin-bottom: 1.5rem;
      font-weight: 600;
    }
    label {
      display: block;
      font-weight: 500;
      margin-bottom: 0.4rem;
      color: #333;
    }
    input[type="text"],
    textarea,
    select {
      width: 100%;
      padding: 0.8rem;
      border: 1px solid #ccc;
      border-radius: 6px;
      margin-bottom: 1rem;
      font-size: 1rem;
      transition: 0.3s;
    }
    input[type="text"]:focus,
    textarea:focus,
    select:focus {
      border-color: #6a0dad;
      outline: none;
    }
    input[type="file"] {
      margin-bottom: 1rem;
    }
    button {
      width: 100%;
      background: #6a0dad;
      color: white;
      border: none;
      padding: 0.9rem;
      border-radius: 6px;
      cursor: pointer;
      font-size: 1rem;
      font-weight: 500;
      transition: 0.3s;
    }
    button:hover {
      background: #580a9e;
    }
    .note {
      text-align: center;
      color: gray;
      font-size: 0.9rem;
      margin-top: 0.8rem;
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>Report an Issue</h2>
    <form method="POST" enctype="multipart/form-data">
      {% csrf_token %}

      <label for="title">Title</label>
      <input type="text" id="title" name="title" placeholder="Enter issue title" required>

      <label for="description">Description</label>
      <textarea id="description" name="description" placeholder="Describe the issue clearly..." rows="5" required></textarea>

      <label for="category">Category</label>
      <select id="category" name="category" required>
        <option value="">-- Select a Category --</option>
        <option value="Road Damage">Road Damage</option>
        <option value="Water Supply">Water Supply</option>
        <option value="Electricity">Electricity</option>
        <option value="Garbage">Garbage</option>
        <option value="Public Safety">Public Safety</option>
      </select>

      <label for="location">Location</label>
      <input type="text" id="location" name="location" placeholder="Enter issue location" required>

      <label for="photos">Upload Photos (up to 3)</label>
      <input type="file" id="photos" name="photos" accept="image/*" multiple>

      <button type="submit">Submit Issue</button>
      <p class="note">Your report will be reviewed by the concerned department.</p>
    </form>
  </div>
</body>
</html>
