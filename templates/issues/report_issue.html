{% extends "base.html" %}
{% load static %}
{% block title %}Report an Issue{% endblock %}

{% block content %}
<style>
body {
  background: linear-gradient(135deg, #ede7ff, #faf8ff);
}
.report-card {
  background: #fff;
  border-radius: 18px;
  padding: 35px;
  box-shadow: 0 6px 20px rgba(0,0,0,0.1);
  transition: 0.3s;
}
.report-card:hover {
  transform: translateY(-3px);
}
h2 {
  font-weight: 700;
  color: #5a32e8;
}
.form-label {
  font-weight: 600;
}
.btn-submit {
  background: linear-gradient(90deg, #5a32e8, #8758f1);
  color: #fff;
  border: none;
  border-radius: 10px;
  font-weight: 600;
  transition: 0.3s;
}
.btn-submit:hover {
  transform: scale(1.03);
  background: linear-gradient(90deg, #4a26c4, #7548e2);
}
</style>

<div class="container mt-5">
  <div class="col-lg-7 col-md-9 col-sm-11 mx-auto">
    <div class="report-card">
      <h2 class="text-center mb-4"><i class="bi bi-clipboard-plus"></i> Report an Issue</h2>

      {% if messages %}
      {% for message in messages %}
      <div class="alert alert-{{ message.tags }} text-center">{{ message }}</div>
      {% endfor %}
      {% endif %}

      <form method="POST" enctype="multipart/form-data">
        {% csrf_token %}

        <div class="mb-3">
          <label for="title" class="form-label">Title</label>
          <input type="text" id="title" name="title" required class="form-control" placeholder="Enter issue title">
        </div>

        <div class="mb-3">
          <label for="description" class="form-label">Description</label>
          <textarea id="description" name="description" rows="4" required class="form-control"
            placeholder="Describe the issue..."></textarea>
        </div>

        <div class="mb-3">
          <label for="category" class="form-label">Category</label>
          <select id="category" name="category" required class="form-select">
            <option value="">-- Select Category --</option>
            <option value="Roads">Roads</option>
            <option value="Water Supply">Water Supply</option>
            <option value="Electricity">Electricity</option>
            <option value="Waste Management">Waste Management</option>
            <option value="Public Safety">Public Safety</option>
            <option value="Other">Other</option>
          </select>
        </div>

        <div class="mb-3">
          <label for="location" class="form-label">Location</label>
          <input type="text" id="location" name="location" required class="form-control"
            placeholder="Enter area or landmark">
        </div>

        <div class="mb-3">
          <label for="photos" class="form-label">Upload Photos (optional)</label>
          <input type="file" id="photo1" name="photo1" class="form-control mb-2">
          <input type="file" id="photo2" name="photo2" class="form-control mb-2">
          <input type="file" id="photo3" name="photo3" class="form-control">
          <small class="text-muted">Upload up to 3 images (JPG/PNG).</small>
        </div>

        <button type="submit" class="btn btn-submit w-100 py-2">
          <i class="bi bi-send-check"></i> Submit Report
        </button>
      </form>
    </div>
  </div>
</div>
{% endblock %}
