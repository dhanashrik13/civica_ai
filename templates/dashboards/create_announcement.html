{% extends 'base_officer.html' %}
{% block title %}Create Announcement{% endblock %}
{% block content %}
<div class="page-header" style="margin-bottom: 24px;">
    <h2 style="margin: 0; font-size: 24px; font-weight: 800; color: var(--text-main);">Create New Announcement</h2>
</div>

<div class="card" style="background: white; border-radius: 20px; padding: 24px; box-shadow: 0 4px 15px rgba(0,0,0,0.05);">
    <div class="card-body">
        <form method="POST">
            {% csrf_token %}
            
            <div class="form-group" style="margin-bottom: 20px;">
                <label style="display: block; margin-bottom: 8px; font-weight: 700; font-size: 12px; color: var(--text-muted); text-transform: uppercase;">Title</label>
                <input type="text" name="title" class="form-control" style="width: 100%; padding: 12px; border: 1px solid var(--border); border-radius: 10px; font-family: inherit;" placeholder="Enter title" required>
            </div>

            <div class="form-group" style="margin-bottom: 20px;">
                <label style="display: block; margin-bottom: 8px; font-weight: 700; font-size: 12px; color: var(--text-muted); text-transform: uppercase;">Content</label>
                <textarea name="content" class="form-control" rows="4" style="width: 100%; padding: 12px; border: 1px solid var(--border); border-radius: 10px; font-family: inherit;" placeholder="Enter announcement details" required></textarea>
            </div>

            <div class="form-group" style="margin-bottom: 24px;">
                <label style="display: block; margin-bottom: 8px; font-weight: 700; font-size: 12px; color: var(--text-muted); text-transform: uppercase;">Expiry Duration</label>
                <select name="duration" class="form-control" style="width: 100%; padding: 12px; border: 1px solid var(--border); border-radius: 10px; font-family: inherit; background-color: white;">
                    <option value="1">1 Day</option>
                    <option value="3">3 Days</option>
                    <option value="7" selected>7 Days</option>
                </select>
            </div>

            <div class="form-actions" style="display: flex; gap: 12px;">
                <button type="submit" class="ai-btn" style="padding: 0 24px; height: 44px;" onclick="this.disabled=true; this.innerText='Processing...'; this.form.submit();">Submit Announcement</button>
                <a href="{% url 'accounts:redirect_dashboard' %}" class="action-btn" style="padding: 0 24px; height: 44px; display: flex; align-items: center; justify-content: center;">Cancel</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
