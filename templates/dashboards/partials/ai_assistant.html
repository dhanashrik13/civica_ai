<!-- AI Assistant Floating UI - UPGRADED -->
<style>
    .ai-assistant-wrapper {
        position: fixed;
        bottom: 30px;
        right: 30px;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        align-items: flex-end;
    }

    .ai-chat-panel {
        width: 380px;
        height: 550px;
        background: white;
        border-radius: 16px;
        box-shadow: 0 12px 40px rgba(0,0,0,0.15);
        display: none; 
        flex-direction: column;
        overflow: hidden;
        margin-bottom: 20px;
        border: 1px solid #e5e7eb;
        transition: all 0.3s ease;
    }

    .ai-chat-header {
        padding: 18px;
        background: var(--primary-gradient);
        color: white;
        display: flex;
        justify-content: space-between;
        align-items: center;
        flex-shrink: 0;
    }

    .ai-chat-messages {
        flex: 1;
        padding: 15px;
        overflow-y: auto;
        background: #f9fafb;
        display: flex;
        flex-direction: column;
        gap: 12px;
        scroll-behavior: smooth;
        min-height: 0;
    }

    .ai-message {
        max-width: 85%;
        padding: 10px 14px;
        border-radius: 12px;
        font-size: 0.9rem;
        line-height: 1.4;
        position: relative;
        overflow-wrap: break-word;
        word-break: break-word;
        white-space: pre-wrap;
        flex-shrink: 0;
    }

    .ai-message.user {
        align-self: flex-end;
        background: #7c3aed;
        color: white;
        border-bottom-right-radius: 2px;
        margin-left: 15%;
    }

    .ai-message.bot {
        align-self: flex-start;
        background: white;
        color: #000000 !important;
        border: 1px solid #e5e7eb;
        border-bottom-left-radius: 2px;
        margin-right: 15%;
        opacity: 1 !important;
        font-weight: 450;
    }

    .ai-message.bot div, .ai-message.bot span, .ai-message.bot p {
        color: #000000 !important;
        opacity: 1 !important;
    }

    .ai-message.insight {
        background: #fffbeb;
        border: 1px solid #fcd34d;
        color: #92400e;
        max-width: 100%;
        text-align: center;
        font-weight: 500;
        border-radius: 8px;
        align-self: center;
        margin: 5px 0;
        flex-shrink: 0;
    }

    .ai-quick-actions {
        padding: 10px 15px;
        display: flex;
        gap: 8px;
        overflow-x: auto;
        background: white;
        border-top: 1px solid #f3f4f6;
        scrollbar-width: thin;
        flex-shrink: 0;
    }

    .action-chip {
        white-space: nowrap;
        background: #f3f4f6;
        color: #4b5563;
        padding: 6px 12px;
        border-radius: 20px;
        font-size: 0.75rem;
        cursor: pointer;
        border: 1px solid #e5e7eb;
        transition: 0.2s;
        flex-shrink: 0;
    }

    .action-chip:hover {
        background: #e5e7eb;
        color: #1f2937;
    }

    .ai-chat-input {
        padding: 15px;
        border-top: 1px solid #e5e7eb;
        display: flex;
        gap: 10px;
        background: white;
        flex-shrink: 0;
    }

    .ai-chat-input input#aiUserMsg {
        flex: 1;
        border: 1px solid #e5e7eb;
        border-radius: 8px;
        padding: 10px 12px;
        outline: none;
        font-size: 0.9rem;
        color: #111827;
        background: #ffffff;
    }

    .ai-chat-input input::placeholder {
        color: #9ca3af;
    }

    .ai-chat-input input:focus {
        border-color: #7c3aed;
        box-shadow: 0 0 0 2px rgba(124, 58, 237, 0.1);
    }

    .ai-chat-input button {
        background: var(--primary-gradient);
        color: white;
        border: none;
        border-radius: 8px;
        padding: 0 15px;
        cursor: pointer;
    }

    .ai-toggle-btn {
        width: 60px;
        height: 60px;
        border-radius: 50%;
        background: var(--primary-gradient);
        color: white;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 24px;
        cursor: pointer;
        box-shadow: 0 8px 25px rgba(124, 58, 237, 0.4);
        transition: transform 0.2s;
        flex-shrink: 0;
    }

    .ai-toggle-btn.pulse {
        animation: pulse-animation 2s infinite;
    }

    @keyframes pulse-animation {
        0% { box-shadow: 0 0 0 0px rgba(124, 58, 237, 0.4); }
        100% { box-shadow: 0 0 0 20px rgba(124, 58, 237, 0); }
    }

    .typing-indicator {
        font-style: italic;
        color: #9ca3af;
        font-size: 0.8rem;
        display: none;
        padding: 5px 20px;
        flex-shrink: 0;
    }
</style>

<div class="ai-assistant-wrapper">
    <div class="ai-chat-panel" id="aiChatPanel">
        <div class="ai-chat-header">
            <div>
                <i class="bi bi-stars"></i>
                <span style="font-weight: 600; margin-left: 8px;">CivicPulse Intelligence</span>
            </div>
            <button class="btn-close btn-close-white" onclick="toggleAIChat()"></button>
        </div>
        
        <div class="ai-chat-messages" id="aiChatMessages">
            <div class="ai-message bot">
                System online. I'm monitoring issues and ready to assist with actions.
            </div>
        </div>

        <div id="typingIndicator" class="typing-indicator">AI is thinking...</div>

        <div class="ai-quick-actions">
            <div class="action-chip" onclick="quickQuery('Show pending issues')">Pending Issues</div>
            <div class="action-chip" onclick="quickQuery('Which area is critical?')">Critical Areas</div>
            <div class="action-chip" onclick="quickQuery('Assign nearest officer')">Auto Assign</div>
        </div>

        <form class="ai-chat-input" id="aiChatForm">
            {% csrf_token %}
            <input type="text" id="aiUserMsg" placeholder="Type command or query..." autocomplete="off">
            <button type="submit"><i class="bi bi-send-fill"></i></button>
        </form>
    </div>

    <div class="ai-toggle-btn" id="aiToggleBtn" onclick="toggleAIChat()">
        <i class="bi bi-robot"></i>
    </div>
</div>

<script>
    let aiInitialized = false;

    // Auto-load proactive insights on dashboard load
    window.addEventListener('load', async function() {
        if (!aiInitialized) {
            setTimeout(fetchProactiveInsights, 2000);
        }
    });

    async function fetchProactiveInsights() {
        try {
            const response = await fetch("{% url 'assistant:ai_assistant' %}", {
                method: "POST",
                headers: {
                    "X-CSRFToken": document.querySelector('[name=csrfmiddlewaretoken]').value,
                    "Content-Type": "application/x-www-form-urlencoded",
                },
                body: "proactive=true"
            });
            const data = await response.json();
            if (data.reply) {
                appendMessage(data.reply, 'insight');
                document.getElementById('aiToggleBtn').classList.add('pulse');
            }
        } catch (e) {}
    }

    function toggleAIChat() {
        const panel = document.getElementById('aiChatPanel');
        const btn = document.getElementById('aiToggleBtn');
        panel.style.display = panel.style.display === 'flex' ? 'none' : 'flex';
        btn.classList.remove('pulse');
        if (panel.style.display === 'flex') {
            document.getElementById('aiUserMsg').focus();
            aiInitialized = true;
        }
    }

    function quickQuery(text) {
        document.getElementById('aiUserMsg').value = text;
        document.getElementById('aiChatForm').dispatchEvent(new Event('submit'));
    }

    document.getElementById('aiChatForm').addEventListener('submit', async function(e) {
        e.preventDefault();
        const input = document.getElementById('aiUserMsg');
        const submitBtn = this.querySelector('button[type="submit"]');
        const message = input.value.trim();
        if (!message) return;

        // Capture page context
        const context = document.title + " | " + window.location.pathname;

        appendMessage(message, 'user');
        input.value = '';
        input.disabled = true;
        submitBtn.disabled = true;

        const typing = document.getElementById('typingIndicator');
        typing.style.display = 'block';

        try {
            const response = await fetch("{% url 'assistant:ai_assistant' %}", {
                method: "POST",
                headers: {
                    "X-CSRFToken": document.querySelector('[name=csrfmiddlewaretoken]').value,
                    "Content-Type": "application/x-www-form-urlencoded",
                },
                body: `message=${encodeURIComponent(message)}&context=${encodeURIComponent(context)}`
            });

            const data = await response.json();
            if (data.action_required) {
                appendMessage(data.reply, 'bot', data);
            } else {
                appendMessage(data.reply, 'bot');
            }
        } catch (error) {
            appendMessage("Connection error. System offline.", 'bot');
        } finally {
            typing.style.display = 'none';
            input.disabled = false;
            submitBtn.disabled = false;
            input.focus();
        }
    });

    function appendMessage(text, role, actionData = null) {
        const container = document.getElementById('aiChatMessages');
        const div = document.createElement('div');
        div.className = `ai-message ${role}`;
        
        const textDiv = document.createElement('div');
        textDiv.textContent = text;
        div.appendChild(textDiv);

        if (actionData && actionData.action_required) {
            const btnGroup = document.createElement('div');
            btnGroup.className = 'mt-2 d-flex gap-2 justify-content-center confirmation-buttons';
            
            const confirmBtn = document.createElement('button');
            confirmBtn.className = 'btn btn-sm btn-success py-1 px-2';
            confirmBtn.style.fontSize = '0.75rem';
            confirmBtn.innerHTML = '<i class="bi bi-check-circle"></i> Confirm';
            confirmBtn.onclick = () => handleAction(actionData.action_token, 'confirm', btnGroup);

            const cancelBtn = document.createElement('button');
            cancelBtn.className = 'btn btn-sm btn-outline-danger py-1 px-2';
            cancelBtn.style.fontSize = '0.75rem';
            cancelBtn.innerHTML = '<i class="bi bi-x-circle"></i> Cancel';
            cancelBtn.onclick = () => handleAction(actionData.action_token, 'cancel', btnGroup);

            btnGroup.appendChild(confirmBtn);
            btnGroup.appendChild(cancelBtn);
            div.appendChild(btnGroup);
        }

        container.appendChild(div);
        
        // Auto-scroll to bottom with safety margin
        requestAnimationFrame(() => {
            container.scrollTop = container.scrollHeight;
        });
    }

    async function handleAction(actionToken, actionType, btnGroup) {
        // Disable buttons
        btnGroup.querySelectorAll('button').forEach(b => { b.disabled = true; });
        
        const confirmBtn = btnGroup.querySelector('.btn-success');
        if (confirmBtn && actionType === 'confirm') {
            confirmBtn.innerHTML = '<span class="spinner-border spinner-border-sm"></span> Dispatched...';
        }
        
        const url = actionType === 'confirm' ? "{% url 'assistant:confirm_ai_action' %}" : "{% url 'assistant:cancel_ai_action' %}";
        
        try {
            const response = await fetch(url, {
                method: "POST",
                headers: {
                    "X-CSRFToken": document.querySelector('[name=csrfmiddlewaretoken]').value,
                    "Content-Type": "application/x-www-form-urlencoded",
                },
                body: `action_token=${encodeURIComponent(actionToken)}`
            });
            const data = await response.json();
            
            if (data.success) {
                if (data.status === 'processing') {
                    // Start Polling for async task completion
                    pollTaskStatus(actionToken, btnGroup);
                } else {
                    btnGroup.innerHTML = `<span class="badge bg-success p-2"><i class="bi bi-check-lg"></i> ${data.message}</span>`;
                }
            } else {
                btnGroup.innerHTML = `<span class="badge bg-danger p-2"><i class="bi bi-exclamation-triangle"></i> ${data.message}</span>`;
            }
        } catch (e) {
            btnGroup.innerHTML = `<span class="badge bg-danger p-2">Network Error</span>`;
        }
    }

    async function pollTaskStatus(token, btnGroup) {
        let attempts = 0;
        const maxAttempts = 12; // Poll for 60 seconds (5s intervals)
        
        const interval = setInterval(async () => {
            attempts++;
            try {
                const res = await fetch(`{% url "assistant:get_action_status" %}?action_token=${encodeURIComponent(token)}`);
                const data = await res.json();
                
                if (data.status === 'success') {
                    clearInterval(interval);
                    btnGroup.innerHTML = `<span class="badge bg-success p-2"><i class="bi bi-check-lg"></i> ${data.message}</span>`;
                } else if (data.status === 'fail' || data.status === 'failed') {
                    clearInterval(interval);
                    btnGroup.innerHTML = `<span class="badge bg-danger p-2"><i class="bi bi-x-circle"></i> ${data.message || 'Task failed'}</span>`;
                } else if (data.status === 'processing') {
                    const confirmBtn = btnGroup.querySelector('.btn-success');
                    if (confirmBtn) confirmBtn.innerHTML = '<span class="spinner-border spinner-border-sm"></span> Processing...';
                }
                
                if (attempts >= maxAttempts) {
                    clearInterval(interval);
                    btnGroup.innerHTML = `<span class="badge bg-warning p-2">Still processing... Please check issues dashboard.</span>`;
                }
            } catch (e) {
                clearInterval(interval);
            }
        }, 5000); // 5 second polling interval
    }

</script>
