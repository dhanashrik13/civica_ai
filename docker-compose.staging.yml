version: '3.8'

services:
  db:
    image: postgres:15-alpine
    volumes:
      - postgres_staging_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=civica_staging_db
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=staging_password
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '0.2'
          memory: 128M

  web:
    build: .
    command: gunicorn final_proj.wsgi:application --bind 0.0.0.0:8000 --workers 2
    volumes:
      - .:/app
      - static_staging_volume:/app/staticfiles
      - media_staging_volume:/app/media
    environment:
      - DJANGO_DEBUG=False
      - DJANGO_SECRET_KEY=staging_secret_key_change_me
      - DATABASE_URL=postgres://postgres:staging_password@db:5432/civica_staging_db
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8080:8000"
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M

  worker:
    build: .
    command: celery -A final_proj worker --loglevel=info --queues=default,high_priority
    volumes:
      - .:/app
    environment:
      - DATABASE_URL=postgres://postgres:staging_password@db:5432/civica_staging_db
      - CELERY_BROKER_URL=redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M

  nginx:
    image: nginx:alpine
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d
      - static_staging_volume:/app/staticfiles
      - media_staging_volume:/app/media
    ports:
      - "8081:80"
    depends_on:
      - web

volumes:
  postgres_staging_data:
  static_staging_volume:
  media_staging_volume:
